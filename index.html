<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABB Industrial Plug & Socket</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
  color: #333;
}

header {
  background-color: #d32f2f;
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
}

.logo {
  display: block;
  margin: 20px auto;
  width: 160px;
}

.about {
  max-width: 900px;
  margin: 20px auto;
  padding: 20px;
  background: white;
  border-radius: 8px;
}

.about h2 {
  color: #d32f2f;
  text-align: center;
}

.products {
  max-width: 900px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 20px;
}

.product-card {
  background: white;
  border-radius: 8px;
  padding: 15px;
  text-align: center;
  transition: 0.3s;
}

.product-card:hover {
  transform: scale(1.05);
}

.product-card img {
  width: 100%;
  height: 150px;
  object-fit: contain;
}

.product-card p {
  font-weight: bold;
  color: #b71c1c;
}

.back-btn {
  display: block;
  width: 220px;
  margin: 30px auto;
  padding: 10px;
  text-align: center;
  background: #d32f2f;
  color: white;
  text-decoration: none;
  border-radius: 6px;
}
</style>
</head>

<body>

<header>ABB Industrial Plug & Socket</header>

<img src="abb.jpg" class="logo" alt="ABB Logo">

<div class="about">
<h2>About ABB</h2>
<p>
ABB offers high-quality industrial plugs and sockets designed for safety,
durability, and performance in demanding industrial environments.
</p>
</div>

<div class="products">
<div class="product-card">
<img src="ip.jpg">
<p>Industrial Plugs</p>
</div>
<div class="product-card">
<img src="is.jpg">
<p>Industrial Sockets</p>
</div>
<div class="product-card">
<img src="c.jpg">
<p>Connectors</p>
</div>
</div>
<a href="https://namethopanenti28-oss.github.io/ipl/" class="back-btn">⬅ Back to Brands</a>

</body>
</html>
